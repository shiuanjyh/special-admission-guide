name: Auto Update Admission Data & Deploy

on:
  schedule:
    # 每天台灣時間早上 08:00 (UTC 00:00) 自動定時檢查更新
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁「Actions」標籤頁隨時點擊一鍵手動執行

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權 Actions 機器人可以寫入並推送代碼到儲存庫

    steps:
      - name: 檢出專案程式碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行資料自動化抓取與更新腳本 (Run Updater)
        run: |
          python updater.py

      - name: 檢測是否有更新，並自動推送至 GitHub (Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js admission_data.json admission_summary.csv

          if git diff --staged --quiet; then
            echo "✅ 目前資料庫已是最新狀態，無需推送更新。"
          else
            echo "🚀 偵測到資料庫變更，正在自動提交並推送至 GitHub..."
            git commit -m "chore(auto): 自動更新最新特殊選才簡章時程與招生數據 [$(date +'%Y-%m-%d %H:%M')]"
            git push
            echo "🎉 成功推送到 GitHub！GitHub Pages 將在 30 秒內自動更新上線！"
          fi
