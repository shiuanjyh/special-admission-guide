<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>大學特殊選才落點探索與數據導航 (112～114學年度)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 超精簡頂部導航欄 (單行、緊湊、極省空間) -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="brand">
        <div class="brand-icon">特</div>
        <div class="brand-text">
          <span class="brand-title">特選落點導航</span>
          <span class="badge badge-year">112-114</span>
        </div>
      </div>

      <div class="nav-actions">
        <button class="btn btn-nav btn-schedule" id="btn-view-schedule" title="查看歷年重要日程與推估">
          <span>📅</span><span class="nav-btn-text">時程表</span>
        </button>
        <button class="btn btn-nav" id="btn-view-compare" title="查看橫向對比">
          <span>⚖️</span><span class="nav-btn-text">對比</span>
          <span class="badge badge-count" id="compare-count">0</span>
        </button>
        <button class="btn btn-nav" id="btn-view-bookmarks" title="查看志願收藏清單">
          <span>★</span><span class="nav-btn-text">收藏</span>
          <span class="badge badge-count" id="bookmark-count">0</span>
        </button>
        <div class="nav-divider"></div>
        <button class="btn btn-icon" id="btn-export-data" title="匯出個人條件設定與收藏">
          <span>📤</span>
        </button>
        <button class="btn btn-icon" id="btn-import-trigger" title="匯入已儲存之設定檔">
          <span>📥</span>
        </button>
        <input type="file" id="file-import" accept=".json" style="display: none;">
      </div>
    </div>
  </nav>

  <!-- 主畫面配置 -->
  <main class="main-layout">
    
    <!-- 左側：個人條件與偏才背景設定 (桌面常駐，手機抽屜式折疊) -->
    <aside class="matcher-panel" id="matcher-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>🎯</span> 條件與落點設定
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-outline btn-sm" id="btn-reset-filters">
            重置
          </button>
          <button class="btn btn-outline btn-sm mobile-close-panel" id="btn-close-panel">
            ✕ 關閉
          </button>
        </div>
      </div>

      <!-- 目標學群 -->
      <div class="filter-group">
        <label class="filter-label" for="filter-category">目標學群類別</label>
        <select class="select-custom" id="filter-category"></select>
      </div>

      <!-- 身分與資歷背景 -->
      <div class="filter-group">
        <label class="filter-label" for="filter-background">個人教育資歷 / 身分</label>
        <select class="select-custom" id="filter-background"></select>
      </div>

      <!-- APCS 程式檢定 (資訊電資組關鍵) -->
      <div class="filter-group">
        <label class="filter-label">APCS 程式檢定 (若無請填0)</label>
        <div class="apcs-grid">
          <div class="apcs-box">
            <label for="apcs-concept">觀念題級分</label>
            <select class="select-custom" id="apcs-concept">
              <option value="0">未測驗 / 0級</option>
              <option value="1">1 級分</option>
              <option value="2">2 級分</option>
              <option value="3">3 級分</option>
              <option value="4">4 級分</option>
              <option value="5">5 頂級分</option>
            </select>
          </div>
          <div class="apcs-box">
            <label for="apcs-practice">實作題級分</label>
            <select class="select-custom" id="apcs-practice">
              <option value="0">未測驗 / 0級</option>
              <option value="1">1 級分</option>
              <option value="2">2 級分</option>
              <option value="3">3 級分</option>
              <option value="4">4 級分</option>
              <option value="5">5 頂級分</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 專業競賽與特殊事證 -->
      <div class="filter-group">
        <label class="filter-label">特殊獲獎、科展與探究成果</label>
        <div class="checkbox-list" id="competitions-checkboxes"></div>
      </div>

      <!-- 外語檢定能力 -->
      <div class="filter-group">
        <label class="filter-label">外語檢定與稀有語種</label>
        <div class="checkbox-list" id="languages-checkboxes"></div>
      </div>

      <!-- 學校層級偏好 -->
      <div class="filter-group">
        <label class="filter-label" for="filter-tier">學校層級</label>
        <select class="select-custom" id="filter-tier"></select>
      </div>

      <!-- 地區偏好 -->
      <div class="filter-group">
        <label class="filter-label" for="filter-region">所在地區</label>
        <select class="select-custom" id="filter-region"></select>
      </div>
    </aside>

    <!-- 右側：結果展示區 -->
    <section class="results-area">

      <!-- 一體化搜尋、篩選切換與排序控制列 (緊湊單行，極度省空間) -->
      <div class="search-toolbar">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="搜尋校系、APCS、清大科藝、中正資傳、元智...">
        </div>

        <button class="btn btn-outline filter-toggle-btn" id="btn-toggle-filters" title="展開條件篩選面板">
          <span>🎯 篩選</span>
          <span class="badge filter-count-badge" id="mobile-filter-badge">0</span>
        </button>

        <div class="sort-wrapper">
          <select class="select-custom sort-select" id="sort-select" title="排序方式">
            <option value="fit">適配度最高</option>
            <option value="quota114">114名額最多</option>
            <option value="growth">名額成長最大</option>
          </select>
        </div>
      </div>

      <!-- 精簡可關閉的時程跑馬提示條 (高度僅28px) -->
      <div class="announcement-pill" id="announcement-pill">
        <span class="pill-icon">📢</span>
        <span class="pill-text" onclick="openScheduleModal()">
          現正處於 114 特選簡章公布與報名備戰期（點此看各校歷年日期對照）➔
        </span>
        <button class="pill-close" onclick="document.getElementById('announcement-pill').style.display='none'" title="關閉提示">✕</button>
      </div>

      <!-- 活躍篩選標籤與數量列 -->
      <div class="filter-summary-row">
        <div class="active-filters" id="active-filter-chips"></div>
        <div class="results-count-badge">
          符合校系：<strong id="results-count">0</strong> 所
        </div>
      </div>

      <!-- 校系卡片網格 -->
      <div class="cards-grid" id="cards-container"></div>
    </section>
  </main>

  <!-- 全國歷年重要日程與推估 Modal -->
  <div class="modal-overlay" id="schedule-modal" onclick="if(event.target === this) closeModal('schedule-modal')">
    <div class="modal-content" style="max-width: 900px;">
      <div class="modal-header">
        <h3 style="font-size: 1.05rem; font-weight: 700;">📅 全國大學特殊選才歷年重要時程演變與今年日期推估</h3>
        <button class="btn btn-outline btn-sm" onclick="closeModal('schedule-modal')">✕</button>
      </div>
      <div class="modal-body" id="modal-schedule-body"></div>
    </div>
  </div>

  <!-- 校系詳細資訊 Modal -->
  <div class="modal-overlay" id="detail-modal" onclick="if(event.target === this) closeModal('detail-modal')">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1.05rem; font-weight: 700;">校系特殊選才詳細規範、歷年時程與錄取分析</h3>
        <button class="btn btn-outline btn-sm" onclick="closeModal('detail-modal')">✕</button>
      </div>
      <div class="modal-body" id="modal-detail-content"></div>
    </div>
  </div>

  <!-- 志願收藏清單 Modal -->
  <div class="modal-overlay" id="bookmarks-modal" onclick="if(event.target === this) closeModal('bookmarks-modal')">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 1.05rem; font-weight: 700;">★ 我的目標志願清單</h3>
        <button class="btn btn-outline btn-sm" onclick="closeModal('bookmarks-modal')">✕</button>
      </div>
      <div class="modal-body" id="modal-bookmarks-body"></div>
    </div>
  </div>

  <!-- 橫向對比 Modal -->
  <div class="modal-overlay" id="compare-modal" onclick="if(event.target === this) closeModal('compare-modal')">
    <div class="modal-content" style="max-width: 1040px;">
      <div class="modal-header">
        <h3 style="font-size: 1.05rem; font-weight: 700;">⚖️ 校系橫向詳細對比</h3>
        <button class="btn btn-outline btn-sm" onclick="closeModal('compare-modal')">✕</button>
      </div>
      <div class="modal-body" id="modal-compare-body"></div>
    </div>
  </div>

  <!-- 資料庫與腳本引入 -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
